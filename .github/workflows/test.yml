name: "Test"
on: [push, workflow_dispatch]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: npm run format:ci
      - run: vp run format:ci
      - run: vp run tsc
      - run: vp test
      - run: vp build
